<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise! 🎉</title>
    <link rel="icon" type="image/png" href="./hos-logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 毛玻璃卡片 - 默认状态 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px; /* 初始宽度 */
            text-align: center;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            /* 核心：添加丝滑的形变过渡动画 */
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }

        /* 卡片展开后的游戏机状态 */
        .glass-card.playing {
            max-width: 900px; /* 展开成超宽屏，视野更好 */
            padding: 20px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 30%, 60% { transform: scale(1); }
            15%, 45% { transform: scale(1.2); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #fff;
            color: #e73c7e;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transform: scale(1.05);
        }

        /* 游戏区域 */
        #gameArea {
            display: none;
            width: 100%;
            height: 350px; /* 横版跑酷高度不需要太高，主要靠宽度 */
            background-color: #fff;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            position: relative;
            /* 淡入动画 */
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .tip-text {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-top: 12px;
            display: none;
        }

        /* 适配手机竖屏：稍微缩小高度 */
        @media (max-width: 600px) {
            #gameArea {
                height: 250px; 
            }
        }

    </style>
</head>
<body>

    <div class="glass-card" id="cardContainer">
        <!-- 初始提示界面 -->
        <div id="introArea">
            <div class="icon">💖</div>
            <h1>骗到你了！</h1>
            <p>当你的手机扫过这个码时，我的代码花了 0.001 秒思考是收下你的钱，还是给你一个拥抱。</p>
            <p><strong>最后它选择了后者。</strong></p>
            <p>既然来都来了，在此挑战一下原汁原味的小恐龙吧！</p>
            
            <button class="btn" onclick="startGame()">🦖 启动小恐龙游戏机</button>
        </div>

        <!-- 游戏界面 -->
        <div id="gameArea">
            <iframe id="dinoFrame" src="https://wayou.github.io/t-rex-runner/" scrolling="no"></iframe>
        </div>
        <div class="tip-text" id="gameTip">
            👆 电脑端点击上方白框后按【空格键】<br>手机端建议【横屏】游玩，点击白框区域跳跃
        </div>
    </div>

    <script>
        function startGame() {
            // 隐藏文字介绍
            document.getElementById('introArea').style.display = 'none';
            
            // 让卡片变宽
            document.getElementById('cardContainer').classList.add('playing');
            
            // 等待卡片变宽的动画执行一半时，再显示游戏区域，显得更丝滑
            setTimeout(() => {
                document.getElementById('gameArea').style.display = 'block';
                document.getElementById('gameTip').style.display = 'block';
                
                // 聚焦游戏，方便电脑用户直接按空格
                const iframe = document.getElementById('dinoFrame');
                iframe.focus();
                iframe.contentWindow.focus();
            }, 250);
        }
    </script>
</body>
</html>
