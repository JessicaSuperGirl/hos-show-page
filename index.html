<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise! 🎉</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 动态渐变背景保持不变 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            transition: all 0.3s ease;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 30%, 60% { transform: scale(1); }
            15%, 45% { transform: scale(1.2); }
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #fff;
            color: #e73c7e;
            box-shadow: 0 0 20px rgba(255,255,255,0.4);
            transform: scale(1.05);
        }

        /* 原版游戏内嵌区域 */
        #gameArea {
            display: none;
            width: 100%;
            height: 350px; /* 为原版游戏留出足够高度 */
            background-color: #fff; /* 原版游戏背景需要是白色 */
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* 修正 iframe 内部的缩放以适配移动端 */
            transform-origin: top left;
        }

        .tip-text {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            margin-top: 15px;
            display: none;
        }

    </style>
</head>
<body>

    <div class="glass-card" id="cardContainer">
        <!-- 初始提示界面 -->
        <div id="introArea">
            <div class="icon">💖</div>
            <h1>骗到你了！</h1>
            <p>当你的手机扫过这个码时，我的代码花了 0.001 秒思考是收下你的钱，还是给你一个拥抱。</p>
            <p><strong>最后它选择了后者。</strong></p>
            <p>既然来都来了，在此挑战一下原汁原味的小恐龙吧！</p>
            
            <button class="btn" onclick="startGame()">🦖 启动原版小恐龙</button>
        </div>

        <!-- 游戏内嵌界面 -->
        <div id="gameArea">
            <!-- 直接引用开源社区 1:1 提取的 Chrome 官方游戏纯净镜像 -->
            <iframe id="dinoFrame" src="https://wayou.github.io/t-rex-runner/" scrolling="no"></iframe>
        </div>
        <div class="tip-text" id="gameTip">
            👆 电脑端请先点击一下上方白框，再按【空格键】游玩<br>手机端直接点击上方白框区域即可跳跃
        </div>
    </div>

    <script>
        function startGame() {
            // 隐藏欢迎文字
            document.getElementById('introArea').style.display = 'none';
            // 显示游戏区域
            document.getElementById('gameArea').style.display = 'block';
            document.getElementById('gameTip').style.display = 'block';
            
            // 调整外层卡片的内边距，让白框游戏机显得更饱满
            document.getElementById('cardContainer').style.padding = '20px';
            
            // 尝试让 iframe 获得焦点，以便直接按空格键生效
            setTimeout(() => {
                const iframe = document.getElementById('dinoFrame');
                iframe.focus();
                iframe.contentWindow.focus();
            }, 100);
        }
    </script>
</body>
</html>
